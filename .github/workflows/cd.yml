name: CD - Build Alpine Docker Images

on:
  pull_request:
    branches:
      - main
    paths:
      - 'mobile_phone_plans/**'
      - 'internet_box_plans/**'
      - 'VERSION'
      - '.bumpversion.toml'
      - '.github/workflows/cd-delivery.yml'
      - 'infrastructure/**'

jobs:
  job-build-alpine-images:
    name: Build Alpine Docker images
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - name: mobile_phone_plans
            context: mobile_phone_plans
            dockerfile: mobile_phone_plans/Dockerfile-alpine
            image: quechoisir-mobile-phone-plans-etl
          - name: internet_box_plans
            context: internet_box_plans
            dockerfile: internet_box_plans/Dockerfile-alpine
            image: quechoisir-internet-box-plans-etl

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }} Alpine Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:pr-${{ github.event.number }}-alpine
          push: true

  job-terraform-apply-gcp-instance:
    name: Apply Terraform for GCP instance
    runs-on: ubuntu-latest
    needs: build-alpine-images

    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Apply Terraform in infrastructure/gcp_instance
        working-directory: infrastructure/gcp_instance
        run: |
          terraform init -input=false
          terraform apply -auto-approve -input=false -var "project_id=${GCP_PROJECT_ID}"
