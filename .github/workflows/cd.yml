name: CD - Build Alpine Docker Images

on:
  pull_request:
    branches:
      - main
    paths:
      - 'mobile_phone_plans/**'
      - 'internet_box_plans/**'
      - 'VERSION'
      - '.bumpversion.toml'
      - '.github/workflows/cd-delivery.yml'

jobs:
  build-alpine-images:
    name: Build Alpine Docker images
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - name: mobile_phone_plans
            context: mobile_phone_plans
            dockerfile: mobile_phone_plans/Dockerfile-alpine
            image: tagny/quechoisir-mobile-phone-plans-etl
          - name: internet_box_plans
            context: internet_box_plans
            dockerfile: internet_box_plans/Dockerfile-alpine
            image: tagny/quechoisir-internet-box-plans-etl

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }} Alpine Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          tags: |
            ${{ matrix.image }}:latest
            ${{ matrix.image }}:pr-${{ github.event.number }}-alpine
          push: true
